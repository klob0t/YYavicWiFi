# Codemagic build of the patched YYavicWiFi kext (same steps as build.yml).
# Put this file in the fork's top folder (next to README.md), together with
# yyavic-0.7.3-local-v7.patch. In Codemagic: add the repo, choose
# "codemagic.yaml" as the configuration, then "Start new build" with the
# workflow "Build patched YYavicWiFi". The zipped kext is under Artifacts.

workflows:
  build-kext:
    name: Build patched YYavicWiFi
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      vars:
        YY_VERSION: 0.7.33
    scripts:
      - name: Apply local patch to the upstream commit
        script: |
          git fetch --unshallow || true
          git checkout 33c4a28 -- Source
          git apply --verbose yyavic-0.7.3-local-v7.patch

      - name: Show toolchain
        script: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Build
        script: |
          cd Source
          zsh ./build-yyavic.sh release

      - name: Zip the kext
        script: |
          cd Source/build-release
          ditto -c -k --keepParent YYavicWiFi.kext YYavicWiFi-0.7.33.zip

      - name: Show build logs on failure
        ignore_failure: true
        script: |
          for f in Source/build-release/*.log; do echo "=== $f"; tail -60 "$f"; done

    artifacts:
      - Source/build-release/YYavicWiFi-0.7.33.zip
      - Source/build-release/*.log

name: Build patched YYavicWiFi

# Put this file in your fork at .github/workflows/build.yml and the patch
# (yyavic-0.7.3-local-v5.patch) in the repository root. Then: Actions tab ->
# "Build patched YYavicWiFi" -> Run workflow. The kext is in the run's
# Artifacts section when it finishes.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Apply local patch to the upstream commit
        run: |
          git fetch --unshallow || true
          git checkout 33c4a28 -- Source
          git apply --verbose yyavic-0.7.3-local-v5.patch

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Build
        working-directory: Source
        env:
          YY_VERSION: 0.7.31
        run: |
          zsh ./build-yyavic.sh release

      - name: Show build logs on failure
        if: failure()
        run: |
          for f in Source/build-release/*.log; do echo "=== $f"; tail -60 "$f"; done

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: YYavicWiFi-0.7.31-assoclog
          path: Source/build-release/YYavicWiFi.kext
